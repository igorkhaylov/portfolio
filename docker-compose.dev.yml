name: ${PROJECT_NAME:-portfolio}-dev


# Caps Docker's json-file logs so they can't fill the disk (default driver has no rotation).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"


services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile.dev
    env_file:
      - ./.env
    logging: *default-logging
    volumes:
      # The whole repo is mounted at /app; manage.py lives at /app/backend (see Makefile EXEC).
      # Uploaded media defaults to backend/media (git-ignored).
      - .:/app
    expose:
      - 8000
    depends_on:
      db:
        condition: service_healthy
    command: sleep infinity
    restart: unless-stopped

  db:
    image: postgres:17.4
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 5
      timeout: 3s
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    logging: *default-logging
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${APP_PORT:-8050}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped


volumes:
  postgres-data:
