name: ${PROJECT_NAME:-portfolio}

# Local production-like stack: builds the backend image from source and serves via
# gunicorn (`make up`). The server uses docker-compose.prod.yml, which pulls the image.


# Caps Docker's json-file logs so they can't fill the host disk (default driver has no rotation).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"


services:
  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - ./.env
    logging: *default-logging
    expose:
      - 8000
    volumes:
      # Uploads live on the host, not in object storage (unlike the template): one
      # domain, one port, and nginx serves media/ and static/ straight from disk.
      - ${DATA_DIR:-./data}/media:/app/media
      - static-data:/app/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck/ || exit 1"]
      interval: 30s
      retries: 5
      # Generous grace window: migrate + collectstatic run before gunicorn binds.
      start_period: 60s
      timeout: 3s
    command: bash scripts/entrypoint.sh
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  db:
    image: postgres:17.4
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 5
      timeout: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  nginx:
    image: nginx:stable-alpine
    logging: *default-logging
    ports:
      # Loopback only: the edge nginx on the host proxies here. Docker-published ports
      # bypass ufw, so binding 0.0.0.0 would expose the stack past the edge.
      - "127.0.0.1:${APP_PORT:-8050}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static-data:/srv/static:ro
      - ${DATA_DIR:-./data}/media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m


volumes:
  postgres-data:
  static-data:
