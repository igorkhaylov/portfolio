name: ${PROJECT_NAME:-portfolio}

# Production deploy compose. The backend image is PULLED from the registry — nothing is
# built on the server. Pin the exact image/tag via BACKEND_IMAGE in .env, e.g.
#   BACKEND_IMAGE=ghcr.io/igorkhaylov/portfolio:sha-<full-sha>
# (a moving :latest works too, but pin a sha-/digest for reproducible deploys).
#
# Files the server needs: this file + ./.env + ./nginx/nginx.conf + the data directory
# (DATA_DIR: media/ — avatar, CV, project covers and screenshots; see .env.example).
# Deploy:  make prod deploy   (= docker compose -f docker-compose.prod.yml pull && up -d)


# Caps Docker's json-file logs so they can't fill the host disk (default driver has no rotation).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"


services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/igorkhaylov/portfolio:latest}
    pull_policy: always
    env_file:
      - ./.env
    logging: *default-logging
    expose:
      - 8000
    volumes:
      # Uploads live on the host, not in object storage (unlike the template): one
      # domain, one port, and nginx serves media/ and static/ straight from disk.
      - ${DATA_DIR:-./data}/media:/app/media
      - static-data:/app/static
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck/ || exit 1"]
      interval: 30s
      retries: 5
      # Generous grace window: migrate + collectstatic run before gunicorn binds.
      start_period: 60s
      timeout: 3s
    command: bash scripts/entrypoint.sh
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  db:
    image: postgres:17.4
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      retries: 5
      timeout: 3s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  # Optional automated PostgreSQL backups (tiredofit/db-backup). DISABLED by default:
  # it only starts when the "backup" compose profile is active. Enable it by setting
  #   COMPOSE_PROFILES=backup
  # in ./.env (then `make prod deploy` picks it up), or run it once with
  #   docker compose -f docker-compose.prod.yml --profile backup up -d
  #
  # Scope: the PostgreSQL database ONLY. Media lives in DATA_DIR on the host —
  # `make dump media` covers it (docs/backup.md).
  db-backup:
    image: ${DB_BACKUP_IMAGE:-ghcr.io/tiredofit/docker-db-backup:4.1.100}
    profiles: ["backup"]
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Connection — reuses the app's Postgres credentials.
      DB01_TYPE: pgsql
      DB01_HOST: db
      DB01_PORT: "5432"
      DB01_NAME: ${POSTGRES_DB}
      DB01_USER: ${POSTGRES_USER}
      DB01_PASS: ${POSTGRES_PASSWORD}
      # Schedule + retention, in MINUTES. Defaults: back up every 24h, keep 7 days.
      DB01_BACKUP_INTERVAL: ${DB_BACKUP_INTERVAL:-1440}
      DB01_CLEANUP_TIME: ${DB_BACKUP_CLEANUP_TIME:-10080}
      DB01_COMPRESSION: ${DB_BACKUP_COMPRESSION:-ZSTD}
      DB01_BACKUP_LOCATION: FILESYSTEM
      DB01_FILESYSTEM_PATH: /backup
    volumes:
      # Host path where the dumps land.
      - ${DB_BACKUP_FS_PATH:-./db-backups}:/backup
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  nginx:
    image: nginx:stable-alpine
    logging: *default-logging
    ports:
      # Loopback only: the edge nginx on the host proxies here. Docker-published ports
      # bypass ufw, so binding 0.0.0.0 would expose the stack past the edge.
      - "127.0.0.1:${APP_PORT:-8490}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static-data:/srv/static:ro
      - ${DATA_DIR:-./data}/media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m


volumes:
  postgres-data:
  static-data:
