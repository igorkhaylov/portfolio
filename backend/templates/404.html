{% extends "base.html" %}
{% load i18n %}

{% block title %}404 — {{ profile.full_name }}{% endblock %}

{% block body %}
    <section class="section not-found">
        <div class="container container--narrow">
            <p class="eyebrow">HTTP 404</p>
            <h1>{% translate "This page does not exist." %}</h1>
            <p><a class="button button--primary" href="{% url 'portfolio:index' %}">{% translate "Back to home" %}</a></p>
        </div>
    </section>
{% endblock %}
