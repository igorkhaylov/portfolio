{% load i18n %}

{% if skill_groups %}
    <section id="skills" class="skills section-bg">
        <div class="container">

            <div class="section-title">
                <h2>{% translate "Skills" %}</h2>
            </div>

            <div class="row skills-content">
                {% for group in skill_groups %}
                    <div class="col-lg-6" data-aos="fade-up" {% if not forloop.first %}data-aos-delay="100"{% endif %}>
                        <h4 class="mb-3">{{ group.title }}</h4>
                        {% for skill in group.skills.all %}
                            {% if skill.is_published %}
                                <div class="progress">
                                    <span class="skill">
                                        {% if skill.icon %}<i class="bx {{ skill.icon }}"></i> {% endif %}{{ skill.name }}
                                        <i class="val">{{ skill.level }}%</i>
                                    </span>
                                    <div class="progress-bar-wrap">
                                        <div class="progress-bar" role="progressbar" aria-valuenow="{{ skill.level }}"
                                             aria-valuemin="0" aria-valuemax="100"></div>
                                    </div>
                                </div>
                            {% endif %}
                        {% endfor %}
                    </div>
                {% endfor %}
            </div>

        </div>
    </section>
{% endif %}
