{% load static i18n %}

<section id="hero" class="d-flex flex-column justify-content-center align-items-center"
         {% if profile.hero_image %}style="background-image: url('{{ profile.hero_image.large.url }}');"{% endif %}>
    <div class="hero-container" data-aos="fade-in">
        <h1>{{ profile.full_name }}</h1>
        <p>
            {% translate "I am" %}
            <span class="typed" data-typed-items="{{ profile.headline }}">{{ profile.headline_items.0 }}</span>
        </p>
        {% if profile.resume_file %}
            <a href="{{ profile.resume_file.url }}" class="btn-hero" download>{% translate "Download CV" %}</a>
        {% endif %}
    </div>
</section>
